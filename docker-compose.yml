services:
  jocky:
    build: { context: ., dockerfile: Dockerfile }
    image: jocky/compiler:1.0
    volumes: [".:/app", "jocky-build:/app/build"]
    working_dir: /app
    networks: [jocky-net]
    command: bash -c "echo 'JOCKY compiler ready' && tail -f /dev/null"
  agent:
    build: { context: ., dockerfile: agent/Dockerfile }
    image: jocky/agent:1.0
    volumes: ["./testdata:/app/testdata:ro"]
    environment: [BACKEND_URL=http://nginx:80, AGENT_ID=WIN-001]
    depends_on: [backend, nginx]
    networks: [jocky-net]
  backend:
    build: { context: ./backend }
    image: jocky/backend:1.0
    ports: ["8000:8000"]
    environment: [DATABASE_URL=postgresql://jocky:jocky@db:5432/jockydb, REDIS_URL=redis://redis:6379/0, MINIO_ENDPOINT=minio:9000, JWT_SECRET=change-me-in-prod]
    depends_on: { db: { condition: service_healthy }, redis: { condition: service_started }, minio: { condition: service_started } }
    networks: [jocky-net]
  frontend:
    build: { context: ./frontend }
    image: jocky/frontend:1.0
    ports: ["3000:3000"]
    depends_on: [backend]
    networks: [jocky-net]
  db:
    image: postgres:15-alpine
    environment: [POSTGRES_USER=jocky, POSTGRES_PASSWORD=jocky, POSTGRES_DB=jockydb]
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL","pg_isready -U jocky"], interval: 5s, retries: 10 }
    networks: [jocky-net]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    networks: [jocky-net]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment: [MINIO_ROOT_USER=minioadmin, MINIO_ROOT_PASSWORD=minioadmin]
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
    networks: [jocky-net]
  nginx:
    image: nginx:1.25-alpine
    ports: ["80:80"]
    volumes: ["./nginx/nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [backend]
    networks: [jocky-net]
  detector:
    build: { context: ., dockerfile: yara/Dockerfile }
    image: jocky/detector:1.0
    depends_on: [backend]
    networks: [jocky-net]
volumes: { pgdata: {}, miniodata: {}, jocky-build: {} }
networks: { jocky-net: { driver: bridge } }
