services:
  jocky:
    build: { context: ., dockerfile: Dockerfile }
    image: jocky/compiler:1.0
    volumes: [".:/app", "jocky-build:/app/build"]
    working_dir: /app
    networks: [jocky-net]
    command: bash -c "echo 'JOCKY compiler ready' && tail -f /dev/null"
  agent:
    build: { context: ., dockerfile: agent/Dockerfile }
    image: jocky/agent:1.0
    volumes: ["./testdata:/app/testdata:ro"]
    environment: [BACKEND_URL=http://nginx:80, AGENT_ID=WIN-001, HOST_ID=HOST-001, CASE_ID=1, JOCKY_SOURCE=system.info();process.list();file.hash("/evidence/sample.exe");network.connections();, FIXTURE_DIR=/app/testdata, AGENT_POLL_SECONDS=0]
    depends_on: { backend: { condition: service_healthy }, nginx: { condition: service_started } }
    healthcheck: { test: ["CMD-SHELL", "curl -sf http://nginx:80/health || exit 1"], interval: 30s, retries: 3, start_period: 15s }
    restart: "no"
    networks: [jocky-net]
  backend:
    build: { context: ./backend }
    image: jocky/backend:1.0
    ports: ["8000:8000"]
    environment: [DATABASE_URL=postgresql://jocky:jocky@db:5432/jockydb, REDIS_URL=redis://redis:6379/0, MINIO_ENDPOINT=minio:9000, JWT_SECRET=change-me-in-prod]
    volumes: ["./yara:/app/yara:ro", "./testdata:/app/testdata:ro"]
    depends_on: { db: { condition: service_healthy }, redis: { condition: service_started }, minio: { condition: service_started } }
    healthcheck: { test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"], interval: 10s, retries: 10, start_period: 20s }
    restart: unless-stopped
    networks: [jocky-net]
  frontend:
    build: { context: ./frontend }
    image: jocky/frontend:1.0
    ports: ["3000:3000"]
    depends_on: [backend]
    networks: [jocky-net]
  db:
    image: postgres:15-alpine
    environment: [POSTGRES_USER=jocky, POSTGRES_PASSWORD=jocky, POSTGRES_DB=jockydb]
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL","pg_isready -U jocky -d jockydb"], interval: 5s, retries: 10 }
    restart: unless-stopped
    networks: [jocky-net]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    networks: [jocky-net]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment: [MINIO_ROOT_USER=minioadmin, MINIO_ROOT_PASSWORD=minioadmin]
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
    networks: [jocky-net]
  nginx:
    image: nginx:1.25-alpine
    ports: ["8082:80"]
    volumes: ["./nginx/nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [backend]
    networks: [jocky-net]
  detector:
    build: { context: ., dockerfile: yara/Dockerfile }
    image: jocky/detector:1.0
    depends_on: [backend]
    networks: [jocky-net]
volumes: { pgdata: {}, miniodata: {}, jocky-build: {} }
networks: { jocky-net: { driver: bridge } }
