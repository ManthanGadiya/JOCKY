# Nginx - Trusted Cloud / CDN / Domain-fronting simulation (L5)
# Agent -> https://cdn.jocky.local (Nginx:80) -> backend:8000
# Logical equivalent of domain fronting / CDN proxy inside jocky-net
events {}
http {
  upstream backend { server backend:8000; }
  server {
    listen 80;
    server_name cdn.jocky.local;
    # CORS + proxy to backend
    location / {
      proxy_pass http://backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
    location /ws/ {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}
