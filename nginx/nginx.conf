# Nginx - Trusted Cloud / CDN / Domain-fronting simulation (L5) per SECURITY_MODEL §41 + ROADMAP Phase 16 Hardening
# Agent -> https://cdn.jocky.local (Nginx:80/443) -> backend:8000
# Logical equivalent of domain fronting / CDN proxy inside jocky-net
# Hardening: TLS termination at nginx (lab uses 80, prod should use 443 with certs). See .env.example CORS_ORIGINS.
events {}
http {
  upstream backend { server backend:8000; }
  # HTTP (lab) — redirects to HTTPS in prod when TLS certs present
  server {
    listen 80;
    server_name cdn.jocky.local;
    # In prod with TLS, uncomment redirect:
    # if ($http_x_forwarded_proto = "http") { return 301 https://$host$request_uri; }
    # CORS + proxy to backend
    location / {
      proxy_pass http://backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      # Hardening headers per SECURITY §41
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    location /ws/ {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
  # HTTPS (prod) — uncomment when certs available at /etc/nginx/certs/
  # server {
  #   listen 443 ssl;
  #   server_name cdn.jocky.local;
  #   ssl_certificate /etc/nginx/certs/cdn.jocky.local.crt;
  #   ssl_certificate_key /etc/nginx/certs/cdn.jocky.local.key;
  #   ssl_protocols TLSv1.2 TLSv1.3;
  #   ssl_ciphers HIGH:!aNULL:!MD5;
  #   location / { proxy_pass http://backend; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
  #   location /ws/ { proxy_pass http://backend; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
  # }
}
